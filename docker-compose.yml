services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    command:
      - /opt/venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

volumes:
  mysql_volume:
