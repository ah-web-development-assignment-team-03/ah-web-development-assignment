services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    command:
      - /opt/venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_volume:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    entrypoint: sh -c "python -m worker.main"
    volumes:
      - ./worker:/app/worker
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_volume:
  static_volume:
  media_volume:
  redis_volume:
